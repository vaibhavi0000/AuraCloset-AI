      // Polyfill/setter patch for environments where window.fetch has only a getter
      (function() {
        try {
          var _f = window.fetch;
          var descriptor = {
            get: function() { return _f; },
            set: function(val) { _f = val; },
            configurable: true,
            enumerable: true
          };
          try { Object.defineProperty(window, 'fetch', descriptor); } catch(e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try { Object.defineProperty(Window.prototype, 'fetch', descriptor); } catch(e) {}
          }
        } catch (err) {}
      })();
    </script>
